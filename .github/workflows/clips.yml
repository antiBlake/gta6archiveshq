name: clips
# Every 2 h: streamer moments from Twitch, judged and captioned by free Gemini (cloud, Mac not needed).
on:
  schedule: [{ cron: "23 */2 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: gta6-state, cancel-in-progress: false }
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: tools
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
          mkdir -p tools/bin media/raw media/edits
          curl -sSL -o tools/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux && chmod +x tools/bin/yt-dlp
      - run: |
          git config user.name "gta6-bot"; git config user.email "gta6-bot@users.noreply.github.com"
          node tools/twitch.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: save state
        run: |
          git config user.name "gta6-bot"; git config user.email "gta6-bot@users.noreply.github.com"
          git add -A drafts state
          git diff --cached --quiet || git commit -m "clips: streamer drafts"
          git pull --rebase --autostash -X theirs -q && git push -q
