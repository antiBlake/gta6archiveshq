name: report
# Every evening at 21:00 WAT (20:00 UTC): Buffer metrics -> scoreboard.csv + Telegram summary.
on:
  schedule: [{ cron: "0 20 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: gta6-state, cancel-in-progress: false }
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/cloud.mjs report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      - run: node tools/learn.mjs $( [ "$(date -u +%u)" = 7 ] && echo --telegram )
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: save state
        run: |
          git config user.name "gta6-bot"; git config user.email "gta6-bot@users.noreply.github.com"
          git add -A scoreboard.csv drafts state learning.md
          git diff --cached --quiet || git commit -m "report: metrics"
          git pull --rebase --autostash -X theirs -q && git push -q
