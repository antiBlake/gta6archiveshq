name: tick
# Every 30 min: Telegram taps/commands -> publish approved posts via Buffer -> official news check.
on:
  schedule: [{ cron: "7 * * * *" }]  # hourly; the Mac also starts it every 30 min while online
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: gta6-state, cancel-in-progress: false }
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/cloud.mjs tick
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      - name: save state
        run: |
          git config user.name "gta6-bot"; git config user.email "gta6-bot@users.noreply.github.com"
          git add -A drafts state log.md scoreboard.csv
          git diff --cached --quiet || git commit -m "tick: state"
          git pull --rebase --autostash -X theirs -q && git push -q
