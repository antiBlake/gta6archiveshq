name: yt-test
# One-off: can GitHub's servers read and download Twitch clips?
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          set +e
          curl -sSL -o yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux && chmod +x yt-dlp
          for ch in kaicenat xqc ishowspeed; do
            echo "== $ch clips (24h)"
            ./yt-dlp --no-warnings --flat-playlist --playlist-end 3 --print "%(title)s | %(url)s" "https://www.twitch.tv/$ch/clips?filter=clips&range=24hr"
          done
          U=$(./yt-dlp --no-warnings --flat-playlist --playlist-end 1 --print "%(url)s" "https://www.twitch.tv/kaicenat/clips?filter=clips&range=24hr")
          echo "== download $U"; ./yt-dlp --no-warnings -o tw.mp4 "$U" | tail -1; ls -la tw.mp4
