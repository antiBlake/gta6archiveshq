name: yt-test
# One-off: can GitHub's servers read and download Twitch clips?
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          set +e
          curl -sSL -o yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux && chmod +x yt-dlp
          echo "== Twitch top clips (GTA VI, 24h)"
          ./yt-dlp --no-warnings --flat-playlist --playlist-end 3 --print "%(id)s | %(title)s | %(webpage_url)s" "https://www.twitch.tv/directory/category/grand-theft-auto-vi/clips?range=24hr"
          U=$(./yt-dlp --no-warnings --flat-playlist --playlist-end 1 --print "%(url)s" "https://www.twitch.tv/directory/category/grand-theft-auto-vi/clips?range=24hr")
          echo "== download $U"; ./yt-dlp --no-warnings -j "$U" | head -c 300; echo
          ./yt-dlp --no-warnings -o tw.mp4 "$U" | tail -2; ls -la tw.mp4
